services:
  db:
    image: postgres:16
    container_name: nova-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova_dev
      POSTGRES_DB: nova
    ports:
      - "5432:5432"
    volumes:
      - nova_pgdata:/var/lib/postgresql/data
      # La primera vez que arranca, Postgres ejecuta los .sql de esta carpeta
      - ./apps/backend/db/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  nova_pgdata: